name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows é onde o painel roda de verdade; Linux é onde ele é desenvolvido
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Dependências
        run: uv sync --locked
      - name: Chromium do Playwright
        run: uv run playwright install --with-deps chromium
      - name: Testes
        run: uv run pytest -q

[project]
name = "boorubot"
version = "0.1.0"
description = "Painel local que publica artes em imageboards (Danbooru, rule34.paheal, rule34.xxx), uma por dia"
authors = [
    { name = "mrlptrc", email = "murilopatricio@gmail.com" }
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "pillow>=12.3.0",
    "playwright==1.55.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
boorubot = "boorubot:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
